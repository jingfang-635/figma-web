# 连接串取自仓库根 .env 预置（MYSQL_JDBC_URL / MYSQL_USER / MYSQL_PASSWORD），不使用 Docker
spring:
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3306/sunshine_medical}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
